<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>微信文章留言导出</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup">
      <header class="header">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none"><path d="M5.5 5.75A3.75 3.75 0 0 1 9.25 2h5.5a3.75 3.75 0 0 1 3.75 3.75v5.5A3.75 3.75 0 0 1 14.75 15H12l-3.8 3.1a.6.6 0 0 1-.98-.46V15.9A3.75 3.75 0 0 1 5.5 12.75v-7Z" fill="currentColor"/><path d="M8.8 8.7h6.4M8.8 11.4h4" stroke="white" stroke-width="1.35" stroke-linecap="round"/></svg>
        </div>
        <div>
          <p class="product-name">微信文章留言导出</p>
          <p class="product-subtitle">本地导出 · 不上传数据</p>
        </div>
        <span id="version" class="version"></span>
      </header>

      <section class="article-card" aria-label="当前文章">
        <div class="article-label">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6.75 4.5h10.5A1.75 1.75 0 0 1 19 6.25v11.5a1.75 1.75 0 0 1-1.75 1.75H6.75A1.75 1.75 0 0 1 5 17.75V6.25A1.75 1.75 0 0 1 6.75 4.5Z" stroke="currentColor" stroke-width="1.5"/><path d="M8.5 9h7M8.5 12h7M8.5 15h4.2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          当前文章
        </div>
        <h1 id="articleTitle" title="">正在识别当前文章…</h1>
      </section>

      <button id="exportButton" type="button" disabled>
        <span class="button-icon" aria-hidden="true">
          <svg class="download-icon" viewBox="0 0 24 24" fill="none"><path d="M12 4v10m0 0 3.5-3.5M12 14 8.5 10.5M5 17.5v.75A1.75 1.75 0 0 0 6.75 20h10.5A1.75 1.75 0 0 0 19 18.25v-.75" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span class="spinner"></span>
        </span>
        <span id="buttonText">导出全部留言</span>
      </button>

      <section class="feedback" aria-live="polite">
        <p id="progress" class="progress"></p>
        <p id="status" class="status"></p>
      </section>

      <footer class="footer"><span class="lock">⌁</span> 留言仅在本地浏览器处理</footer>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
